# Project-local gateway (§5).
#
# This file is mounted into an nginx-unprivileged container inside this
# project's compose stack. It does NOT touch the host's global nginx, and the
# host's nginx configuration is never read or modified by this project.
#
# Routing:
#   /            -> web (Next.js)
#   /api         -> api (Fastify)
#   /healthz     -> api health probe
#   /_next/static-> web, with long cache (immutable, content-hashed)
#   /c /m /r     -> web, with no-store (capsule routes must never be cached)

upstream cinderlink_web {
    server web:3000;
    keepalive 16;
}

upstream cinderlink_api {
    server api:4000;
    keepalive 16;
}

# Rate limit at the edge as a coarse backstop. The application applies the real,
# pseudonymised limits (§18); this only blunts a crude flood before it reaches
# Node at all.
limit_req_zone $binary_remote_addr zone=cinderlink_edge:10m rate=20r/s;

server {
    listen 8080;
    server_name _;

    # Do not advertise the version; §26 asks for no detailed Server header.
    server_tokens off;

    # Ciphertext chunks are the largest bodies (1 MiB + overhead).
    client_max_body_size 8m;
    client_body_timeout 60s;

    # The preview must never be indexed (§6).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        proxy_pass http://cinderlink_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=cinderlink_edge burst=40 nodelay;

        proxy_pass http://cinderlink_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API only trusts this header because TRUST_PROXY is set and this
        # gateway is the sole ingress; it is overwritten here, never appended,
        # so a client cannot inject a forged chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never cache anything from the API (§26).
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Stream ciphertext through rather than buffering whole chunks to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Content-hashed build assets: safe to cache forever.
    location /_next/static/ {
        proxy_pass http://cinderlink_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Capsule, management and request routes: private, never cached anywhere.
    location ~ ^/(c|m|r)/ {
        proxy_pass http://cinderlink_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass http://cinderlink_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # There is deliberately NO location block for the object store. Blobs are
    # served only by the API, after a lease check — never as static files (§14).
}
